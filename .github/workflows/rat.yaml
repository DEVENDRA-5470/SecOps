name: Step 2 - Receive Application Trigger

on:
  repository_dispatch:
    types:
      - application_push

jobs:
  receive-trigger:
    name: Verify Cross-Repo Communication
    runs-on: ubuntu-latest

    steps:

      # Display information received from the Application repository
      - name: Display Received Application Information
        run: |
          echo "SecOps Repo received Application trigger"
          echo "Application Repository: ${{ github.event.client_payload.repository }}"
          echo "Application Branch: ${{ github.event.client_payload.branch }}"
          echo "Application Commit SHA: ${{ github.event.client_payload.commit_sha }}"

      # Checkout the exact application commit that triggered the SecOps pipeline
      - name: Checkout Exact Application Commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.commit_sha }}
          path: application

      # Verify that the checked-out commit matches the received commit SHA
      - name: Verify Checked Out Commit
        run: |
          echo "Application Source Successfully checked out"
          echo "Checked Out Commit SHA:"
          git -C application rev-parse HEAD

      # Copy the central SecOps Gitleaks configuration
      # into the application scanning directory.
      - name: Prepare Gitleaks Configuration
        run: |
          cp .gitleaks.toml application/.gitleaks.toml
          echo "Gitleaks configuration copied successfully"
          echo "Configuration file:"
          ls -l application/.gitleaks.toml

      # Scan the checked-out application source for secrets
      # using the central SecOps Gitleaks configuration.
      - name: Step 4 - Scan for Application Secrets
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/application:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect \
            --source=/repo \
            --config=/repo/.gitleaks.toml \
            --no-git \
            --no-banner \
            --exit-code 1

      # List all files inside the application checkout
      # even if the Gitleaks scan fails.
      - name: Step 4A - List Scanned Files
        if: always()
        run: |
          echo "Files Inside Gitleaks Scanning Scope:"
          echo "====================================="
          find application -type f -print
